name: データ自動更新

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 21:00 UTC ＝ 日本時間 6:00（GitHub側の混雑で数分〜数十分遅れることあり）
  workflow_dispatch: {}     # 手動実行（Actions タブの「Run workflow」）

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 依存パッケージ
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 公式ページから数値を確認して更新
        run: node scripts/update-data.mjs

      - name: テスト（失敗したら更新を保存しない）
        run: npm test

      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.json data/online-shops.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ自動更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
